name: Refresh live cards

# Redraws the two cards with live figures (the track record and the Rug
# Clock) from defade.org's public pages, once a day and on demand. When the
# API does not answer, scripts/build.py draws the last good figures again,
# nothing changes and nothing is committed.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli pillow
      - run: python scripts/build.py --live-only
      - name: Commit the new figures
        run: |
          if git diff --quiet -- assets data; then
            echo "No change in the live figures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git commit -m "Refresh the live cards"
          git push
